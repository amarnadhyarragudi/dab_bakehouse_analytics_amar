# This workflow validates , deploy, and runs the specified bundle
# within a production target named "prod"
name : 'production deployment'


# Ensure that only a single job or workflow using the same concurrency group
# runs at a time.

concurrency: 1

# trigger this workflow whenever a pull request is pushed to the repo's 
# main branch

on:
   push:
      branches: 
         - main 
      paths:
         - 'bakehouse_analytics/**'

jobs:
   deploy:
       name: 'Deploy bundle'
       runs-on: ubuntu-24.04

       steps:
          # instal python library
          - run:
              python -m pip install --upgrade pip
              pip install uv
              
          # Check out this repo, so that this workflow can access it.
          - uses: actions/checkout@v3

          # Download the Databricks CLI.
          # see https://github.com/databricks/setup-cli
          - uses: databricks/setup-cli@main
            with:
               host: ${{ secrets.DATABRICKS_HOST }}
               token: ${{ secrets.SP_TOKEN }}

          # Deploy the bundle to the "prod" target as defined
          # in the bundle's settings file.
          - run: databricks bundle deploy
            working-directory: bakehouse_analytics
            env:
              DATABRICKS_HOST: https://dbc-64beeaa9-c629.cloud.databricks.com
              DATABRICKS_TOKEN: ${{ secrets.SP_TOKEN }}
              DATABRICKS_BUNDLE_ENV: prod
       

