
# Validate and deploy the Databricks Asset Bundle to production
name: "Production Deployment"

# Allow only one deployment to run at a time
concurrency:
  group: databricks-production-deployment
  cancel-in-progress: false

# Trigger on pushes to main when bundle files change
on:
  push:
    branches:
      - main
    paths:
      - "bakehouse_analytics/**"

# Minimum permissions required to check out the repository
permissions:
  contents: read

jobs:
  deploy:
    name: "Validate and Deploy Bundle"
    runs-on: ubuntu-24.04

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Databricks CLI
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      # Validate the production bundle configuration
      - name: Validate bundle
        working-directory: bakehouse_analytics
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.SP_TOKEN }}
        run: databricks bundle validate --target prod

      # Deploy the bundle to production
      - name: Deploy bundle
        working-directory: bakehouse_analytics
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.SP_TOKEN }}
        run: databricks bundle deploy --target prod
